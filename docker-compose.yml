name: music-copilot

services:
  web:
    build: .
    # 默认拉稳定线 latest（CI：v0.1.x）。.env 里 MC_IMAGE_TAG=development 可跟开发分支镜像；
    # 加 --build 时用当前目录 Dockerfile 本地构建（打到同一 image 名）。也可换用 GHCR 仓库名。
    image: supgeekrod/music-copilot:${MC_IMAGE_TAG:-latest}
    container_name: music-copilot
    ports:
      # 对外端口默认 17016，可在 .env 里用 MC_PORT 覆盖
      - "${MC_PORT:-17016}:80"
    # 后端地址（容器内 nginx 的反代目标）；与开发期共用同一份 .env，真实环境变量优先
    environment:
      MC_API_BASE_URL: ${MC_API_BASE_URL:-}
    # 让容器内 host.docker.internal 指向宿主机（后端与 Docker 同机时可用该地址）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 与开发期同一套 .env（MC_ 前缀变量注入容器）
    env_file:
      - .env
    restart: unless-stopped

  # ── 自建后端（第 5 期，profile: server；启用：在 .env 设 COMPOSE_PROFILES=server,scraper）──
  # API 进程（php artisan serve，LAN 自用足够）与下载 worker 同镜像分进程；
  # SQLite 库在 server-data 卷；下载目录挂音乐库目录（fnOS「音乐」应用扫描入库），
  # NAS 端 .env 配 MC_MUSIC_HOST_DIR=音乐库绝对路径（未配则落到项目目录 data/downloads）。
  # scraper 通知（M4）：MC_SCRAPER_URL 默认指向 compose 内 scraper 服务。
  server:
    build: ./server
    image: supgeekrod/music-copilot-server:${MC_IMAGE_TAG:-latest}
    container_name: music-copilot-server
    profiles: [server]
    ports:
      - "${MC_SERVER_PORT:-8097}:8097"
    environment:
      DB_DATABASE: /data/database.sqlite
      MC_DOWNLOAD_DIR: /downloads
      MC_SCRAPER_URL: ${MC_SCRAPER_URL:-http://scraper:8098/mc/api}
    env_file:
      - .env
    volumes:
      - server-data:/data
      - "${MC_MUSIC_HOST_DIR:-./data/downloads}:/downloads"
    restart: unless-stopped

  server-worker:
    build: ./server
    image: supgeekrod/music-copilot-server:${MC_IMAGE_TAG:-latest}
    container_name: music-copilot-server-worker
    profiles: [server]
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=3600"]
    environment:
      DB_DATABASE: /data/database.sqlite
      MC_DOWNLOAD_DIR: /downloads
      MC_SCRAPER_URL: ${MC_SCRAPER_URL:-http://scraper:8098/mc/api}
    env_file:
      - .env
    volumes:
      - server-data:/data
      - "${MC_MUSIC_HOST_DIR:-./data/downloads}:/downloads"
    depends_on:
      - server
    restart: unless-stopped

  # ── 音乐库体检 / 下载完成自动刮削（profile: scraper）──
  # 与 server 共享音乐库目录（server 下载落盘 → scraper 推送通知写标签 → fnOS 扫描入库）。
  scraper:
    image: supgeekrod/music-copilot-scraper:${MC_SCRAPER_IMAGE_TAG:-latest}
    container_name: music-copilot-scraper
    profiles: [scraper]
    environment:
      MC_MUSIC_DIR: /music
      MC_DATA_DIR: /data
      MC_SERVER_URL: http://server:8097
      MC_SERVER_USERNAME: ${MC_AUTH_USERNAME:-admin}
      MC_SERVER_PASSWORD: ${MC_AUTH_PASSWORD:-admin}
    env_file:
      - .env
    volumes:
      - scraper-data:/data
      - "${MC_MUSIC_HOST_DIR:-./data/downloads}:/music"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
  scraper-data:
