name: music-copilot

services:
  web:
    build: .
    image: ghcr.io/supgeek-rod/music-copilot:${MC_IMAGE_TAG:-latest}
    container_name: music-copilot
    ports:
      - "${MC_PORT:-17016}:80"
    environment:
      MC_API_BASE_URL: http://server:8097
      MC_API_USERNAME: ${MC_API_USERNAME:-}
      MC_API_PASSWORD: ${MC_API_PASSWORD:-}
      MC_AUTO_LOGIN: ${MC_AUTO_LOGIN:-true}
      MC_FNOS_BASE_URL: ${MC_FNOS_BASE_URL:-}
      MC_FNOS_USERNAME: ${MC_FNOS_USERNAME:-}
      MC_FNOS_PASSWORD: ${MC_FNOS_PASSWORD:-}
      MC_FNOS_AUTO_LOGIN: ${MC_FNOS_AUTO_LOGIN:-true}
    restart: unless-stopped

  server:
    build: ./server
    image: ghcr.io/supgeek-rod/music-copilot-server:${MC_IMAGE_TAG:-latest}
    container_name: music-copilot-server
    ports:
      - "8097:8097"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((int)!@file_get_contents(\"http://127.0.0.1:8097/api/config/isLogin\"));'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 10m
    environment:
      DB_DATABASE: /data/database.sqlite
      MC_DOWNLOAD_DIR: /downloads
      MC_AUTH_USERNAME: ${MC_AUTH_USERNAME:-admin}
      MC_AUTH_PASSWORD: ${MC_AUTH_PASSWORD:-admin}
      MC_DIR_TEMPLATE: ${MC_DIR_TEMPLATE:-{albumArtist}/{album}/{title} - {albumArtist}.{ext}}
    volumes:
      - server-data:/data
      - "${MC_MUSIC_HOST_DIR:-./data/downloads}:/downloads"
    restart: unless-stopped

volumes:
  server-data:
