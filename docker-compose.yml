name: music-copilot
services:
  web:
    build: .
    # 优先拉取预构建镜像（CI 发布，见 .github/workflows/docker-publish.yml）；
    # 加 --build 时在本地构建。也可换用 GHCR：ghcr.io/supgeek-rod/music-copilot:latest
    image: supgeekrod/music-copilot:latest
    container_name: music-copilot
    ports:
      # 对外端口默认 17016，可在 .env 里用 MC_PORT 覆盖
      - "${MC_PORT:-17016}:80"
    # 后端地址（容器内 nginx 的反代目标）；与开发期共用同一份 .env，真实环境变量优先
    environment:
      MC_API_BASE_URL: ${MC_API_BASE_URL:-}
    # 让容器内 host.docker.internal 指向宿主机（后端与 Docker 同机时可用该地址）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 与开发期同一套 .env（MC_ 前缀变量注入容器）
    env_file:
      - .env
    restart: unless-stopped

  # 元数据刮削工具（可选）：直接读写 NAS 音乐文件的独立容器（音乐库体检后台）。
  # 启用步骤：
  #   1. .env 里设置 MC_MUSIC_DIR=<fnOS 音乐库目录>（读写）与 MC_SCRAPER_BASE_URL=http://scraper:8098
  #   2. docker compose --profile scraper up -d
  # web 容器经 env_file 拿到 MC_SCRAPER_BASE_URL 后自动生成 /mc 反代并显示「体检」入口。
  scraper:
    profiles: ["scraper"]
    build: ./scraper
    image: supgeekrod/music-copilot-scraper:latest
    container_name: music-copilot-scraper
    environment:
      MC_MUSIC_DIR: /music
      MC_DATA_DIR: /data
      # 在线匹配音源（SQMusic 对齐契约：searchSong/getLyric），默认同 web 的后端地址
      MC_SERVER_URL: ${MC_SERVER_URL:-${MC_API_BASE_URL:-http://host.docker.internal:8096}}
      MC_SCRAPER_TOKEN: ${MC_SCRAPER_TOKEN:-}
    volumes:
      # 音乐目录必须读写（写入标签/封面/歌词、备份到 .mc-backup/）
      - "${MC_MUSIC_DIR:?启用 scraper 前请在 .env 设置 MC_MUSIC_DIR}:/music"
      - scraper-data:/data
    ports:
      # 宿主机调试用；web 容器走 compose 内网 http://scraper:8098
      - "${MC_SCRAPER_PORT:-8098}:8098"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    restart: unless-stopped

volumes:
  scraper-data:
