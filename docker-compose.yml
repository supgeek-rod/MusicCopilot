name: music-copilot

services:
  web:
    build: .
    image: ghcr.io/supgeek-rod/music-copilot:${MC_IMAGE_TAG:-latest}
    container_name: music-copilot-web
    ports:
      - "${MC_WEB_PORT:-17016}:80"
    environment:
      - MC_API_BASE_URL=http://server:17017
      - MC_FNOS_AUTO_LOGIN
      - MC_FNOS_BASE_URL
      - MC_FNOS_USERNAME
      - MC_FNOS_PASSWORD
    restart: unless-stopped
    # 探 /api/healthcheck 经反代到 server：后端挂了 web 即 unhealthy（nginx 静态页正常但服务不可用）
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  server:
    build: ./server
    image: ghcr.io/supgeek-rod/music-copilot-server:${MC_IMAGE_TAG:-latest}
    container_name: music-copilot-server
    expose:
      - "17017"
    environment:
      - MC_MUSIC_DOWNLOAD_PATH_TEMPLATE
    volumes:
      - "${MC_SERVER_DATA_DIR:-./data}:/data"
      - "${MC_MUSIC_DOWNLOAD_DIR:-./downloads}:/downloads"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((int)!@file_get_contents(\"http://127.0.0.1:17017/api/healthcheck\"));'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 10m
    restart: unless-stopped
