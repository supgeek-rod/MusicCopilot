name: Build & Publish Scraper Docker Image

# 刮削工具镜像（scraper/），tag 策略与主镜像一致：
# - push 到 development / v0.1.x：发布对应分支名 tag（v0.1.x 分支额外发布 latest）
# - push v* tag：发布语义化版本 tag
# - workflow_dispatch：手动触发
on:
  push:
    branches:
      - development
      - v0.1.x
    tags:
      - 'v*'
    paths:
      - 'scraper/**'
      - '.github/workflows/scraper-docker.yml'
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/supgeek-rod/music-copilot-scraper
  DOCKERHUB_IMAGE: supgeekrod/music-copilot-scraper

jobs:
  build-and-push:
    name: Build and publish scraper image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warn if Docker Hub secrets missing
        if: env.DOCKERHUB_USERNAME == ''
        run: echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets，本次仅发布 GHCR，配置后自动恢复双仓库发布"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GHCR metadata (tags, labels)
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/v0.1.x' }}

      - name: Docker Hub metadata (tags)
        if: env.DOCKERHUB_USERNAME != ''
        id: meta-hub
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/v0.1.x' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./scraper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta-ghcr.outputs.tags }}
            ${{ steps.meta-hub.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          annotations: ${{ steps.meta-ghcr.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
