name: Build & Publish Docker Image

# 触发规则：
# - push 到 development / v0.1.x：发布对应分支名 tag（v0.1.x 为默认分支，额外发布 latest）
# - push v* tag：发布语义化版本 tag（如 v0.1.2 -> 0.1.2 / 0.1）
# - workflow_dispatch：在 Actions 页面手动触发
on:
  push:
    branches:
      - development
      - v0.1.x
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # metadata-action 会自动将镜像名转为小写（仓库 owner 含大写时必须走小写化）
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: supgeekrod/music-copilot

jobs:
  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR 推送依赖内置 GITHUB_TOKEN 的 packages 写权限
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
