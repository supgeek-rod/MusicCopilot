name: Build & Publish Docker Image

# 触发规则：
# - push 到 development：发布 development tag
# - push v* tag：发布语义化版本 tag（如 v0.2.0 -> 0.2.0 / 0.2）并发布 latest（稳定线）
# - workflow_dispatch：在 Actions 页面手动触发，可选任意包含本文件的分支运行
# 双镜像矩阵：web（前端 nginx，web/Dockerfile）与 server（自建后端，server/Dockerfile），
# 两个矩阵项并行构建，tag 策略一致。
on:
  push:
    branches:
      - development
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # 基础名 + 矩阵 suffix 拼出双镜像：web = music-copilot-web，server = music-copilot-server
  GHCR_IMAGE: ghcr.io/supgeek-rod/music-copilot
  DOCKERHUB_IMAGE: supgeekrod/music-copilot

jobs:
  build-and-push:
    name: Build and push (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR 推送依赖内置 GITHUB_TOKEN 的 packages 写权限
    strategy:
      fail-fast: false
      matrix:
        include:
          # 前端镜像：nginx 托管 SPA + /api 反代（web/Dockerfile），镜像名带 -web 后缀
          - name: web
            context: ./web
            suffix: '-web'
            gen-build-info: true
          # 自建后端镜像：Laravel API + queue worker 同镜像分进程（server/Dockerfile）
          - name: server
            context: ./server
            suffix: '-server'
            gen-build-info: false
    env:
      # 映射到 job 级 env 仅为探测 secrets 是否已配置，未配置时跳过 Docker Hub 相关步骤
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate build info
        # 仅 web 需要：容器内构建无 .git（web/.dockerignore 排除），gen-build-info 会降级 hash=dev；
        # checkout 后先在本机生成 web/src/build-info.json，COPY . . 带入构建上下文，
        # 容器内 gen-build-info 走「复用预生成」分支保留真实 hash
        if: matrix.gen-build-info
        working-directory: web
        run: node scripts/gen-build-info.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warn if Docker Hub secrets missing
        if: env.DOCKERHUB_USERNAME == ''
        run: echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets，本次仅发布 GHCR，配置后自动恢复双仓库发布"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GHCR metadata (tags, labels)
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Docker Hub metadata (tags)
        if: env.DOCKERHUB_USERNAME != ''
        id: meta-hub
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          # meta-hub 被跳过时其 outputs 为空，空行会被 build-push-action 过滤
          tags: |
            ${{ steps.meta-ghcr.outputs.tags }}
            ${{ steps.meta-hub.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          annotations: ${{ steps.meta-ghcr.outputs.annotations }}
          # scope 按矩阵项隔离，避免 web/server 的层缓存互相驱逐（gha 缓存上限 10GB）
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
